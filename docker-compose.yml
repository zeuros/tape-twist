# docker compose up -d --build   →   https://<this-machine-ip>:3000 on the local network
# Public access is optional: `./scripts/serve.sh --funnel` (see docker-compose.funnel.yml).
services:
  tape-twist:
    build: .
    # Host network: the QR code shows the LAN address, and phones reach port 3000.
    network_mode: host
    # Chromium (the decks, the login browser) needs a big /dev/shm.
    shm_size: 1gb
    environment:
      PORT: 3000
      # HOST_PIN: "1234"   # else data/host-pin, else 1234
    volumes:
      # Credentials, browser profiles, playlists, recorded pads, PIN, certificate, APK.
      - ./data:/app/data:z   # :z lets SELinux (Fedora) allow the container to write there
      # Ask Claude: your Claude Code login.
      # - ~/.claude:/home/app/.claude
      # - ~/.claude.json:/home/app/.claude.json
    restart: unless-stopped

  # The Android app, built on demand (`./scripts/apk.sh`, run by `serve.sh --funnel`): copies
  # data/tape-twist.apk and exits. Its own image (Dockerfile.apk), never started by `up`.
  apk:
    profiles: [apk]
    build:
      context: .
      dockerfile: Dockerfile.apk
      args:
        CAP_SERVER_URL: ${CAP_SERVER_URL:-}
    user: "1000:1000"
    volumes:
      - ./data:/out:z
