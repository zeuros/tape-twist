# Optional, with the Tailscale Funnel on the host (`./scripts/serve.sh --funnel` adds it).
# There's no Tailscale in the container: the script reads the Funnel address and the home's
# public IP on the host and passes them here (start-up links, QR code, LAN redirect).
services:
  tape-twist:
    environment:
      FUNNEL_HOST: ${FUNNEL_HOST:-}
      HOME_PUBLIC_IP: ${HOME_PUBLIC_IP:-}
